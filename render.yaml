# Render Blueprint for the Sidequest API (FastAPI).
# Render dashboard -> New -> Blueprint -> pick this repo. Render asks for every
# value marked `sync: false` (your secrets) when you create it.
#
# Runs on the FREE instance. A free server has no disk: its files vanish on
# every deploy, restart and spin-down (after ~15 idle minutes). So the SQLite
# databases (accounts, quests, photos, library, history) are backed up
# continuously to a Cloudflare R2 bucket by Litestream (litestream.yml) and
# restored on every start - see scripts/start.sh.
#
# Upgrading later: set `plan: 0.5c-512mb` ($7/mo), add
#   disk: {name: sidequest-data, mountPath: /var/data, sizeGB: 1}
# and point the three *_PATH variables at /var/data/... . Keep the LITESTREAM_*
# variables and R2 stays an off-site backup.
#
# Only ever run ONE instance: two copies would overwrite each other's backups.
services:
  - type: web
    name: sidequest-api
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements-server.txt && bash scripts/install_litestream.sh
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      # --- Storage (local files, restored from R2 on every start) ---
      - key: DATABASE_PATH
        value: data/sidequest.db
      - key: LIBRARY_PATH
        value: data/quest_library.db
      - key: HISTORY_PATH
        value: data/user_history.db

      # --- Litestream -> Cloudflare R2 (R2 > Manage API tokens, "Object Read & Write") ---
      - key: LITESTREAM_BUCKET            # bucket name, e.g. sidequest-backups
        sync: false
      - key: LITESTREAM_ENDPOINT          # https://<account-id>.r2.cloudflarestorage.com
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false

      # --- Accounts ---
      - key: AUTH_REQUIRED
        value: "true"
      - key: SESSION_DAYS
        value: "90"
      # Only needed for the Flutter *web* build: its https URL (comma-separate several)
      - key: CORS_ORIGINS
        sync: false

      # --- Gemma (Google AI Studio by default) ---
      - key: GEMMA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_TIMEOUT
        value: "180"
      - key: GEMMA_TIME_BUDGET
        value: "300"
      - key: GEMMA_MAX_TOKENS
        value: "8192"

      # --- Live location context (OpenStreetMap asks for a contact email) ---
      - key: NOMINATIM_EMAIL
        sync: false

      # --- Optional extras (leave blank to skip) ---
      - key: SERPAPI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: TIGER_DATABASE_URL
        sync: false
