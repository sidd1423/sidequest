# Add `flutter_lints` later (flutter pub add --dev flutter_lints) and include it here.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
  language:
    strict-casts: true
linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - use_key_in_widget_constructors
    - avoid_print
