name: sidequest
description: "Sidequest - quick 5-30 minute outdoor quests to get you outside."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Navigation uses Flutter's built-in Navigator; state uses a ChangeNotifier
# (lib/data/app_state.dart) - no state-management package needed.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0                     # talks to the FastAPI backend
  shared_preferences: ^2.5.3       # login session + offline cache
  image_picker: ^1.1.2             # photos for the quest log (camera on phones, files on desktop/web)
  geolocator: ^14.0.2              # location for weather/nearby places + route tracking
  flutter_map: ^8.2.1              # route map (OpenStreetMap tiles, no API key)
  latlong2: ^0.9.1                 # coordinates for flutter_map
  # 8.x on purpose: 9.x pulls in the `jni` package, whose C code doesn't compile on Windows (MSVC).
  sentry_flutter: ^8.14.2          # crash + error reports (only when built with --dart-define=SENTRY_DSN=...)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
