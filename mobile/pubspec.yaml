name: sidequest
description: "Sidequest - quick 5-30 minute outdoor quests to get you outside."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Navigation uses Flutter's built-in Navigator; state uses a ChangeNotifier
# (lib/data/app_state.dart) - no state-management package needed.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0                     # talks to the FastAPI backend
  shared_preferences: ^2.5.3       # offline cache: profile, quest history, unsynced changes
  flutter_secure_storage: ^10.0.0  # the login token (Keychain / Keystore / DPAPI)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
